# S4 门禁流水线：前端 → lint → unit → parity → build → size-gate → smoke
#
# 顺序刻意与 scripts/build.ps1 的分步一致，失败时能直接看出是哪一道门禁。
#
# ⚠️ 第 0 步必须先构建 ui/dist：`tauri::generate_context!()` 在**编译期**读
#    tauri.conf.json 的 frontendDist（../ui/dist），路径不存在就直接
#    `proc macro panicked: The frontendDist configuration is set to "../ui/dist" but this path doesn't
#    exist`。也就是说任何 cargo 步骤都必须排在它后面。本地因为 ui/dist 早就存在，这个坑不会暴露。
#
# 待校准：① windows-latest 能否跑通真机 WebView2 冒烟（桌面会话）；② artifact 体积是否超配额。
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint / unit / parity / build / size / smoke
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 工具链固定到 rust-toolchain.toml 里的 1.98.1：本地与 CI 共用同一套 rustfmt/clippy，
      # 避免「本地绿、CI 红」的 lint 漂移（@stable 会随上游换版本）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # vendor/updater/bin/*.exe 被 .gitignore 排除（不把二进制塞进仓库），于是 runner 上 build.ps1
      # 第 9 步「拷贝自更新器」必须现场 go build；windows-latest 不预装 Go，这里显式装。
      # vendor/updater 只有 go.mod + main.go（无第三方依赖），所以不需要 go.sum、也不需要联网。
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # 0) 前端产物 —— 必须早于所有 cargo 步骤（见文件头注释）
      - name: 0) 构建前端（ui/dist + ui/dist/react）
        run: |
          npm run ui:app:install
          if ($LASTEXITCODE -ne 0) { throw "ui 依赖安装失败" }
          node ui/scripts/build-ui.mjs
          if ($LASTEXITCODE -ne 0) { throw "同步 ui/dist 失败" }
          npm run check:app
          if ($LASTEXITCODE -ne 0) { throw "S6 应用门禁失败" }

      - name: 1) lint（rustfmt + clippy -D warnings）
        working-directory: src-tauri
        run: |
          rustc --version
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw "rustfmt 校验失败：跑 cargo fmt 后再提交" }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy 校验失败（-D warnings）" }

      - name: 2) unit（Rust 单测）
        working-directory: src-tauri
        run: cargo test --lib

      # 契约 / 安全审计 / 查重 / parity 固定向量 / 渲染层语法 / ui-dist 同步检查
      # 全部是纯 node 脚本，package.json 没有运行时依赖，所以不需要 npm ci
      - name: 3) parity 与 JS 门禁
        run: npm run check

      # -SkipApp：前端在第 0 步已经构建过，这里只做 Rust 构建与门禁
      # -SkipHeavy：L4/L5/L6/L8 是**发布前**的重档门禁（真起 ConPTY 喷 10 万行、真跑更新器替换 exe、
      # 3 次 cargo debug 重编），runner 上不保证有交互桌面会话，放在 CI 只会把红灯归因搞乱。
      # 它们由维护者在发布机上跑（发布检查单见 docs/S7-发布与回滚-实施记录.md §5.2）。
      # 顺带把完整输出落到 build.log 并上传：仓库是 public，Actions 日志 API 对非管理员返回 403，
      # 失败时只能靠 artifact 读回现场（这一条是前几轮「红灯但看不到原因」的直接对策）。
      - name: 4) build + 体积门禁（G4 前置）
        run: |
          pwsh -File scripts/build.ps1 -SkipApp -SkipHeavy *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\build.log"
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 退出码 $LASTEXITCODE" }

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: 5) 真机自检（真实 WebView2 通道自检 + A4 断言）
        run: pwsh -File scripts/smoke-ipc.ps1

      - name: 6) 缺 WebView2 引导冒烟（诊断开关）
        run: pwsh -File scripts/smoke-webview2-missing.ps1

      - name: 上传 exe（体积门禁的实物凭据）
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: EvEJSLauncher-exe
          path: src-tauri/target/release/EvEJSLauncher.exe
          if-no-files-found: warn