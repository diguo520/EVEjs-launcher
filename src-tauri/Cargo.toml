[package]
name = "evejs-launcher"
version = "0.3.6"
description = "EvEJS 启动器（Tauri 2 外壳）"
authors = ["EvEJS"]
edition = "2021"
rust-version = "1.98"

[lib]
name = "evejs_launcher_lib"
# 只做 Windows 桌面外壳，不需要 staticlib/cdylib（那是 Tauri 移动端才要的产物），
# 去掉后构建会少一次 dll/exp 生成，链接更快、目录更干净。
crate-type = ["rlib"]

[[bin]]
name = "EvEJSLauncher"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync", "fs"] }
portable-pty = "0.9.0"
sysinfo = "0.39.6"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "win-system-proxy", "gzip"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
